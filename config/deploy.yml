service: protectedplanet-api

# No registry, no credentials — matching SAPI's Proxmox setup.
#
# `localhost:5555` is a naming prefix. Kamal 2 auto-starts a `registry:3`
# container bound to 127.0.0.1:5555 on whichever machine runs the deploy, and
# because `builder.remote` below targets the same host the app runs on, the
# image is built straight into that host's Docker store. Nothing crosses a
# registry, so there is no token to expire — which is what killed deploys on
# the old Linode staging (see docs/findings/002).
#
# CONSTRAINT: holds only while build host == deploy host. If CI later builds on
# the GitHub Actions runner, the image must cross hosts and a real registry
# comes back into play.
# Each app gets its OWN local-registry port. Kamal forwards this port from the
# deploy host back to the machine running the deploy; with every app on 5555 two
# concurrent deploys ask the same shared host to forward the same port to
# different runners, and one dies with
#   RuntimeError: Failed to establish port forward on pp-web-staging-01
# Distinct ports let all six deploy in parallel.
registry:
  server: localhost:5556

ssh:
  user: wcmc

# kamal-proxy waits this long for a new container to report healthy (default 30).
deploy_timeout: 120

builder:
  arch: amd64
  remote: ssh://wcmc@pp-web-staging-01.internal.unep-wcmc.org
  dockerfile: Dockerfile.deploy
  args:
    DOCKER_BASE_IMAGE: ruby:4.0.2-slim

env:
  clear:
    APPSIGNAL_APP_NAME: protectedplanet-api
  secret:
    - RACK_SESSION_SECRET
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_DBNAME
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - CORS_ORIGINS
    - ADMIN_USERNAME
    - ADMIN_PASSWORD
    - MAILER_AUTHENTICATION
    - MAILER_ADDRESS
    - MAILER_DOMAIN
    - MAILER_USERNAME
    - MAILER_PASSWORD
    - MAILER_HOST
    - MAILER_PORT
    - APPSIGNAL_API_TOKEN

# Kamal 2 replaces Traefik with kamal-proxy: the `traefik:` block, the per-role
# router/middleware labels and the top-level `healthcheck:` block are all gone.
# Routing, TLS, retries and health checking are declared in the `proxy:` block
# in config/deploy.<env>.yml.
