name: Deploy to Proxmox staging (Kamal 2)

# Deploys to the Proxmox staging host (pp-web-staging-01.internal.unep-wcmc.org).
#
# The existing deploy.yml targets the old Linode staging via Kamal 1 and is left
# alone, so both run side by side until Linode is decommissioned.
on:
  push:
    branches:
      - staging_kamal
  workflow_dispatch:

jobs:
  determine-environment:
    runs-on: self-hosted
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      gh-environment: ${{ steps.env.outputs.gh-environment }}
      kamal-secrets-file: ${{ steps.env.outputs.kamal-secrets-file }}
    steps:
      - id: env
        run: |
          # `environment` is the KAMAL destination (config/deploy.staging.yml) and
          # the label shown in Slack — it must stay "staging".
          # `gh-environment` is the GitHub environment the secrets live in. It is
          # separate so the Linode Kamal 1 workflow can keep its own `staging`
          # secrets while this one uses `staging_proxmox`.
          echo "environment=staging" >> $GITHUB_OUTPUT
          echo "gh-environment=staging_proxmox" >> $GITHUB_OUTPUT
          echo "kamal-secrets-file=.kamal/secrets-common" >> $GITHUB_OUTPUT

  deploy:
    needs: determine-environment
    runs-on: self-hosted
    environment: ${{ needs.determine-environment.outputs.gh-environment }}
    # Only the secrets .kamal/secrets-common actually references. This job
    # previously serialised the entire secrets context into one variable and
    # picked through it at runtime, which handed every repository and
    # environment secret to the job and wrote them all to a file on the
    # self-hosted runner.
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      APPSIGNAL_API_TOKEN: ${{ secrets.APPSIGNAL_API_TOKEN }}
      CERTIFICATE_PEM: ${{ secrets.CERTIFICATE_PEM }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      MAILER_ADDRESS: ${{ secrets.MAILER_ADDRESS }}
      MAILER_AUTHENTICATION: ${{ secrets.MAILER_AUTHENTICATION }}
      MAILER_DOMAIN: ${{ secrets.MAILER_DOMAIN }}
      MAILER_HOST: ${{ secrets.MAILER_HOST }}
      MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD }}
      MAILER_PORT: ${{ secrets.MAILER_PORT }}
      MAILER_USERNAME: ${{ secrets.MAILER_USERNAME }}
      POSTGRES_DBNAME: ${{ secrets.POSTGRES_DBNAME }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      PRIVATE_KEY_PEM: ${{ secrets.PRIVATE_KEY_PEM }}
      RACK_SESSION_SECRET: ${{ secrets.RACK_SESSION_SECRET }}
    steps:
      - name: Set workflow start time
        run: |
          echo "START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          echo "ACTION_TYPE=Deploy" >> $GITHUB_ENV

      - uses: actions/checkout@v5

      - name: Notify deployment start
        id: notify-start
        uses: unepwcmc/devops-actions/.github/actions/slack-notify@v1
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          notification-type: started
          action-type: Deploy
          environment: ${{ needs.determine-environment.outputs.environment }}
          repository: ${{ github.repository }}
          repository-url: ${{ github.server_url }}/${{ github.repository }}
          action-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          actor: ${{ github.actor }}
          actor-url: ${{ github.server_url }}/${{ github.actor }}
          workflow-name: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          commit-message: ${{ github.event.head_commit.message || 'Manual workflow trigger' }}
          runner-name: ${{ runner.name }}
          start-time: ${{ env.START_TIME }}

      - name: Validate kamal secrets
        uses: unepwcmc/devops-actions/.github/actions/validate-secrets@v1
        with:
          secrets-file: ${{ needs.determine-environment.outputs.kamal-secrets-file }}
          environment: ${{ needs.determine-environment.outputs.environment }}

      - name: Deploy with Kamal v2
        uses: unepwcmc/devops-actions/.github/actions/kamal-v2.x-deploy@v1
        with:
          environment: ${{ needs.determine-environment.outputs.environment }}
          working-directory: .
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set workflow end time and calculate duration
        if: always()
        run: |
          echo "END_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          if [[ -n "$START_TIME" ]]; then
            start_timestamp=$(date -d "$START_TIME" +%s)
            end_timestamp=$(date -d "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" +%s)
            echo "DEPLOYMENT_DURATION=$((end_timestamp - start_timestamp))" >> $GITHUB_ENV
          else
            echo "DEPLOYMENT_DURATION=0" >> $GITHUB_ENV
          fi

      - name: Notify deployment success
        if: success()
        uses: unepwcmc/devops-actions/.github/actions/slack-notify@v1
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          notification-type: success
          action-type: Deploy
          environment: ${{ needs.determine-environment.outputs.environment }}
          repository: ${{ github.repository }}
          repository-url: ${{ github.server_url }}/${{ github.repository }}
          action-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          actor: ${{ github.actor }}
          actor-url: ${{ github.server_url }}/${{ github.actor }}
          workflow-name: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          commit-message: ${{ github.event.head_commit.message || 'Manual workflow trigger' }}
          runner-name: ${{ runner.name }}
          start-time: ${{ env.START_TIME }}
          end-time: ${{ env.END_TIME }}
          deployment-duration: ${{ env.DEPLOYMENT_DURATION }}
          update-message-ts: ${{ steps.notify-start.outputs.message-ts }}

      - name: Notify deployment failure
        if: failure()
        uses: unepwcmc/devops-actions/.github/actions/slack-notify@v1
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          notification-type: failure
          action-type: Deploy
          environment: ${{ needs.determine-environment.outputs.environment }}
          repository: ${{ github.repository }}
          repository-url: ${{ github.server_url }}/${{ github.repository }}
          action-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          actor: ${{ github.actor }}
          actor-url: ${{ github.server_url }}/${{ github.actor }}
          workflow-name: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          commit-message: ${{ github.event.head_commit.message || 'Manual workflow trigger' }}
          runner-name: ${{ runner.name }}
          start-time: ${{ env.START_TIME }}
          end-time: ${{ env.END_TIME }}
          deployment-duration: ${{ env.DEPLOYMENT_DURATION }}
          update-message-ts: ${{ steps.notify-start.outputs.message-ts }}
